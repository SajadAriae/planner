name: build-apk
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create android project
        run: |
          mkdir /tmp/keep && cp -r lib pubspec.yaml /tmp/keep/
          flutter create --project-name planner --org com.konj --platforms android .
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          cp /tmp/keep/lib/main.dart lib/main.dart
      - name: Patch android config
        run: |
          python3 - <<'PY'
          import re, pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          perms = '''
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
          <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
          <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
          '''
          recv = '''
          <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>
          <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
            <intent-filter>
              <action android:name="android.intent.action.BOOT_COMPLETED"/>
              <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
            </intent-filter>
          </receiver>
          '''
          s = re.sub(r'(<manifest[^>]*>)', lambda x: x.group(1) + perms, s, count=1)
          s = s.replace('</application>', recv + '</application>')
          m.write_text(s)
          for f in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              p = pathlib.Path(f)
              if not p.exists():
                  continue
              kts = f.endswith('.kts')
              g = p.read_text()
              flag = 'isCoreLibraryDesugaringEnabled = true' if kts else 'coreLibraryDesugaringEnabled true'
              g = g.replace('compileOptions {', 'compileOptions {\n        ' + flag, 1)
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")' if kts else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'"
              g += '\ndependencies {\n    ' + dep + '\n}\n'
              p.write_text(g)
          PY
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: planner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
